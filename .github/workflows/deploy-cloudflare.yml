# 部署 Cloudflare 控制面（src/worker.ts：DO + D1 [+ R2]）
#
# 为什么在 GHA 上跑 wrangler：美国 runner 到 Cloudflare 网络干净，
# 国内直连 wrangler/workers.dev 常不稳。
#
# 需要的 Secrets：
#   CLOUDFLARE_API_TOKEN    CF API Token（需 Workers 脚本:编辑、D1:编辑；R2 编辑用于产物存储）
#   CLOUDFLARE_ACCOUNT_ID   CF Account ID
#   HYPITAPP_MASTER_KEY     与应用一致（用于账户库解密；控制面本身不装载账户，占位）
#   HYPITAPP_CALLBACK_SECRET 与 hypit-task workflow 的同一 Secret（校验带签名回调）
#   HYPITAPP_API_TOKEN      控制面 Bearer 鉴权令牌
#   DISPATCH_PAT / DISPATCH_OWNER / DISPATCH_REPO  控制面向 GitHub 发 repository_dispatch
#                           （GitHub 禁止 secret 名以 GITHUB_ 开头，故此处用 DISPATCH_*，
#                            部署时再以 GITHUB_PAT/GITHUB_OWNER/GITHUB_REPO 写入 worker secret）
#
# 触发：Actions → deploy-cloudflare → Run workflow（可选 dryRun）
name: deploy-cloudflare

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: "只构建不部署"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build frontend HTML
        run: node scripts/build-frontend.cjs

      - name: Typecheck
        run: npm run typecheck

      # D1 建表（幂等：schema 用 CREATE TABLE IF NOT EXISTS）
      - name: Apply D1 schema
        run: npx --yes wrangler@3 d1 execute hypitapp --remote --file=src/storage/cloudflare/schema.sql

      - name: Deploy worker
        if: ${{ github.event.inputs.dryRun != 'true' }}
        run: npx --yes wrangler@3 deploy

      - name: Set worker secrets
        if: ${{ github.event.inputs.dryRun != 'true' }}
        env:
          HYPITAPP_MASTER_KEY: ${{ secrets.HYPITAPP_MASTER_KEY }}
          HYPITAPP_CALLBACK_SECRET: ${{ secrets.HYPITAPP_CALLBACK_SECRET }}
          HYPITAPP_API_TOKEN: ${{ secrets.HYPITAPP_API_TOKEN }}
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
          DISPATCH_OWNER: ${{ secrets.DISPATCH_OWNER }}
          DISPATCH_REPO: ${{ secrets.DISPATCH_REPO }}
        run: |
          set -e
          # 空值跳过：否则会把 secret 覆写成空字符串（如未配置 DISPATCH_PAT 时 GITHUB_PAT 被清空，
          # 导致控制面静默跳过 dispatch、任务永远停在 PENDING）
          put() {
            if [ -z "$2" ]; then echo "跳过 $1（值为空，保持原有 secret）"; return 0; fi
            printf '%s' "$2" | npx --yes wrangler@3 secret put "$1"
          }
          put HYPITAPP_MASTER_KEY "$HYPITAPP_MASTER_KEY"
          put HYPITAPP_CALLBACK_SECRET "$HYPITAPP_CALLBACK_SECRET"
          put HYPITAPP_API_TOKEN "$HYPITAPP_API_TOKEN"
          put GITHUB_PAT "$DISPATCH_PAT"
          put GITHUB_OWNER "$DISPATCH_OWNER"
          put GITHUB_REPO "$DISPATCH_REPO"

      - name: Health check
        if: ${{ github.event.inputs.dryRun != 'true' }}
        run: |
          set +e
          sleep 5
          echo "== workers.dev =="
          curl -sS --max-time 20 "https://hypitapp.goodluckjiachen.workers.dev/healthz" || true
          echo
          echo "== custom domain (hypitapp.ygtxl.dpdns.org) =="
          curl -sS --max-time 20 "https://hypitapp.ygtxl.dpdns.org/healthz" || true
          echo